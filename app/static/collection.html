<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja • Impulso</title><link rel="stylesheet" href="/static/shop.css?v=20261119-category2"><script type="module" src="/static/catalog.js?v=20261119-header3"></script></head>
<body data-page="collection"><a class="skip-link" href="#main">Pular para o conteúdo</a><header id="shop-header"></header>
<main id="main" class="collection-page"><div class="wrap"><nav class="breadcrumbs" aria-label="Navegação"><a href="/">Início</a><span>/</span><span>Produtos por categoria</span></nav></div>
    <section id="catalogo" class="wrap catalog-section" aria-labelledby="catalog-title">
      <div class="section-heading compact-heading"><h2 id="catalog-title">Todos os produtos</h2><a href="/?catalogo=1#catalogo" id="view-all-products" class="text-link">Ver tudo</a></div>
      <form id="catalog-filters" class="catalog-filters" role="search">
        <div id="category-tabs" class="category-tabs" aria-label="Categorias"><button type="button" class="chip active" data-category="" aria-pressed="true">Todos os produtos</button></div>
        <div class="search-field"><label class="sr-only" for="search">Buscar produtos pelo nome</label><i data-icon="search"></i><input id="search" name="busca" type="search" placeholder="O que você procura?" maxlength="160"><button type="submit" class="search-submit" aria-label="Buscar">Buscar</button></div>
      </form>
      <div class="catalog-meta"><p id="result-count" aria-live="polite">Buscando produtos…</p><button type="button" id="clear-filters" class="text-button" hidden>Limpar filtros</button></div>
      <div id="catalog-status" class="state-panel" role="status">Preparando seu próximo movimento…</div>
      <div id="product-grid" class="product-grid" aria-label="Produtos" aria-busy="true"></div>
      <nav id="pagination" class="pagination" aria-label="Paginação" hidden><button id="previous-page" class="btn btn-outline" type="button">Anterior</button><span id="page-label"></span><button id="next-page" class="btn btn-outline" type="button">Próxima</button></nav>
    </section>
</main><footer id="shop-footer"></footer><div id="toast" class="toast" role="status" aria-live="polite" hidden></div></body></html>
